<title>Kuwait Orders Data Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --surface-2:#EFEDE7; --line:#E0DCD3;
  --t0:#15181D; --t1:#4C535D; --t2:#79818C;
  --accent:#1F5FB0; --accent-fill:#3987E5; --accent-soft:#E8F0FB;
  --warm:#B0441B; --warm-fill:#D95926;
  --good:#0E6B48; --good-fill:#199E70;
  --grid:#E6E3DC; --shadow:0 1px 2px rgba(20,24,30,.05),0 10px 26px -18px rgba(20,24,30,.35);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E13; --surface:#151A21; --surface-2:#1C232C; --line:#242C37;
  --t0:#F1F4F8; --t1:#A6B1BF; --t2:#727C89;
  --accent:#6FADF5; --accent-fill:#3987E5; --accent-soft:#162333;
  --warm:#F08A5D; --warm-fill:#D95926;
  --good:#3FC494; --good-fill:#199E70;
  --grid:#222A34; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#151A21; --surface-2:#1C232C; --line:#242C37;
  --t0:#F1F4F8; --t1:#A6B1BF; --t2:#727C89;
  --accent:#6FADF5; --accent-fill:#3987E5; --accent-soft:#162333;
  --warm:#F08A5D; --warm-fill:#D95926;
  --good:#3FC494; --good-fill:#199E70;
  --grid:#222A34; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t0);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.015em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px;border-radius:5px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--t2)}

/* ---------- hero ---------- */
.hero{border-bottom:1px solid var(--line);background:
  radial-gradient(760px 300px at 8% -30%, color-mix(in srgb,var(--accent-fill) 14%,transparent), transparent 62%),
  radial-gradient(620px 260px at 92% -20%, color-mix(in srgb,var(--warm-fill) 9%,transparent), transparent 62%);}
.hero-in{padding-block:34px 26px}
.hero h1{font-size:clamp(30px,6.2vw,58px);line-height:.96;font-weight:700;letter-spacing:-.035em;margin-top:12px}
.hero h1 .b{color:var(--accent)}
.hero .tag{margin-top:12px;font-size:clamp(15px,2.2vw,19px);color:var(--t1);max-width:46ch}
.hero .lede{margin-top:8px;font-size:13.5px;color:var(--t2);max-width:64ch}
.hero.slim .hero-in{padding-block:18px 14px}
.hero.slim h1{font-size:clamp(20px,3.4vw,28px);margin-top:6px}
.hero.slim .tag{font-size:13px;margin-top:2px}

/* ---------- nav ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:0 0 auto;appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--t2);font:600 13.5px/1 var(--sans);padding:14px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--t0)}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent-fill)}

/* ---------- filters ---------- */
.filters{border-bottom:1px solid var(--line);background:var(--surface)}
.filters-in{padding-block:14px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.f label{display:block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);margin-bottom:5px}
.f select,.f input{width:100%;background:var(--surface-2);color:var(--t0);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:400 14px/1.2 var(--sans)}
.f.end{display:flex;align-items:flex-end}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--t1);border-radius:9px;padding:9px 12px;font:600 13px/1.2 var(--sans);cursor:pointer;width:100%}
.btn:hover:not(:disabled){border-color:var(--accent-fill);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{width:auto;padding:7px 11px;font-size:12px}
.fnote{margin:10px 0 0;font-size:12px;color:var(--t2)}

/* ---------- surfaces ---------- */
main{padding-block:22px 40px}
.stack{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none;background:transparent;border:0;padding:0}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;min-width:0}
.kpi .k-l{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--t2)}
.kpi .k-v{margin-top:7px;display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-weight:600;font-size:clamp(23px,3.2vw,31px);line-height:1;letter-spacing:-.02em}
.kpi.acc .k-v{color:var(--accent)}
.kpi .k-u{font-size:12px;font-weight:600;color:var(--t2);letter-spacing:0}
.kpi .k-s{margin-top:8px;font-size:11.5px;line-height:1.45;color:var(--t1)}
.striplab{margin:0 0 10px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}
.striplab.mute{color:var(--t2)}

/* ---------- chart frame ---------- */
.cf h3{font-size:clamp(15px,1.9vw,18px);font-weight:600;line-height:1.3}
.cf .sub{margin:5px 0 0;font-size:12px;color:var(--t2)}
.cf .plot{margin-top:16px}
.cf dl{margin:15px 0 0;padding-top:11px;border-top:1px solid var(--line);display:grid;gap:3px;font-size:11px;line-height:1.5;color:var(--t2)}
.cf dl>div{display:flex;gap:8px}
.cf dt{flex:0 0 auto;font-weight:600;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding-top:1px;min-width:66px}
.cf dd{margin:0}

/* ---------- horizontal bars ---------- */
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(74px,124px) 1fr auto;align-items:center;gap:10px}
.bar .bl{font-size:12px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{position:relative;height:19px;border-radius:4px;background:linear-gradient(to right,var(--grid) 1px,transparent 1px) 0 0/25% 100%}
.bar .bf{position:absolute;inset:0 auto 0 0;width:var(--p);border-radius:3px;background:var(--c,var(--accent-fill));transition:width .5s cubic-bezier(.22,.61,.36,1)}
.bar .bv{font-family:var(--mono);font-size:11.5px;color:var(--t1);min-width:52px;text-align:right}
.bar.click{cursor:pointer}
.bar.click:hover .bf{filter:brightness(1.12)}
.bar.dim .bf{opacity:.34}
.axis{display:grid;grid-template-columns:minmax(74px,124px) 1fr auto;gap:10px;margin-top:9px}
.axis .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--t2)}
.axis .pad{min-width:52px}
.axtitle{margin-top:7px;font-size:10.5px;color:var(--t2);text-align:center;font-family:var(--mono);letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.bar .bf{transition:none}}

/* ---------- vertical grouped bars ---------- */
.vwrap{display:grid;grid-template-columns:auto 1fr;gap:10px}
.vaxis{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--t2);height:210px;text-align:right}
.vplot{height:210px;display:flex;gap:26px;align-items:flex-end;border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),var(--grid) calc(25% - 1px),var(--grid) 25%)}
.vgroup{flex:1;display:flex;gap:8px;align-items:flex-end;justify-content:center;height:100%}
.vbar{flex:0 1 46px;border-radius:4px 4px 0 0;background:var(--c,var(--accent-fill));height:var(--h);min-height:2px;position:relative}
.vlabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:26px;margin-top:8px;padding-left:0;font-size:11px;color:var(--t1);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--t1)}
.legend span.sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ---------- line chart ---------- */
.lc{width:100%;display:block;overflow:visible}
.lc .gl{stroke:var(--grid);stroke-width:1}
.lc .ax{stroke:var(--line);stroke-width:1}
.lc text{fill:var(--t2);font-family:var(--mono);font-size:10px}
.lc .hit{fill:transparent;cursor:crosshair}
.lc .cross{stroke:var(--t2);stroke-dasharray:3 3;stroke-width:1;opacity:0}

/* ---------- tooltip ---------- */
#tt{position:fixed;z-index:200;pointer-events:none;opacity:0;transform:translate(-50%,-115%);transition:opacity .11s;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--t0);box-shadow:var(--shadow);max-width:250px}
#tt .tk{font-weight:600;margin-bottom:3px}
#tt .tr{display:flex;gap:8px;align-items:center;color:var(--t1)}
#tt .tr b{color:var(--t0);font-family:var(--mono);font-weight:600;margin-left:auto}

/* ---------- tables ---------- */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--t2);text-align:left;padding:7px 11px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.r{text-align:right}
thead th.s{cursor:pointer}
thead th.s:hover{color:var(--accent)}
tbody td{padding:8px 11px 8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:top}
tbody td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
tfoot td{padding:9px 11px 9px 0;font-weight:600;border-top:1px solid var(--line)}
tfoot td.r{text-align:right;font-family:var(--mono)}
.search{background:var(--surface-2);color:var(--t0);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:400 13px var(--sans);width:min(230px,52vw)}
.pager{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--t2)}

/* ---------- misc ---------- */
.rowhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.rowhead h3{font-size:14px;font-weight:600}
.note{margin:12px 0 0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.55;color:var(--t1)}
.note b{color:var(--warm)}
.pill{display:inline-block;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 11px;font-family:var(--mono);font-size:13px}
.pill.on{border-color:color-mix(in srgb,var(--accent-fill) 45%,var(--line));color:var(--accent)}
.pill.ok{border-color:color-mix(in srgb,var(--good-fill) 45%,var(--line));color:var(--good);font-family:var(--sans);font-size:11.5px;font-weight:600;border-radius:99px}
.eqrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:12px}
.eqrow .op{color:var(--t2)}
code,.code{font-family:var(--mono);font-size:.92em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.ba{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.ba .box{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:13px}
.ba .chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ba .chip{font-family:var(--mono);font-size:10.5px;color:var(--t2);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.ba .to{color:var(--accent);font-weight:700}
.ba .out{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);background:var(--surface);border:1px solid color-mix(in srgb,var(--accent-fill) 45%,var(--line));border-radius:6px;padding:2px 8px}
.ba .bn{margin:9px 0 0;font-size:11.5px;color:var(--t2);line-height:1.5}
.cols3{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.deflist{list-style:none;margin:9px 0 0;padding:0;display:grid;gap:5px;font-size:13px}
.deflist li{display:flex;justify-content:space-between;gap:12px}
.deflist li span:first-child{color:var(--t1)}
.deflist li span:last-child{font-family:var(--mono);font-weight:600}
.two{display:grid;gap:16px}
@media(min-width:1000px){.two{grid-template-columns:1fr 1fr}}
.info{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--t1);width:19px;height:19px;border-radius:50%;font:700 10px/1 var(--sans);cursor:pointer;margin-left:7px;vertical-align:1px}
.info:hover{border-color:var(--accent-fill);color:var(--accent)}
.infobox{margin-top:11px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 13px;font-size:12.5px;line-height:1.6;color:var(--t1)}
.beat{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:26px}
@media(min-width:760px){.beat{grid-template-columns:92px 1fr}}
.beat .n{font-family:var(--mono);font-size:clamp(30px,5vw,46px);font-weight:600;line-height:1;color:color-mix(in srgb,var(--accent-fill) 34%,transparent);letter-spacing:-.04em}
.beat h3{font-size:clamp(17px,2.5vw,24px);font-weight:700}
.beat .body{margin-top:11px;display:grid;gap:11px;max-width:68ch;font-size:clamp(14.5px,1.7vw,16px);line-height:1.66;color:var(--t1)}
.beat .body b{color:var(--t0);font-family:var(--mono);font-weight:600}
.beat .body .mute{color:var(--t2)}
.storyhead{border:1px solid var(--line);border-radius:16px;padding:26px;background:linear-gradient(180deg,var(--surface),var(--bg))}
.storyhead h2{margin-top:12px;font-size:clamp(23px,4.6vw,42px);line-height:1.06;font-weight:700}
.storyhead h2 em{font-style:normal;color:var(--warm)}
.storyhead p{margin:15px 0 0;max-width:60ch;font-size:clamp(15px,2vw,18px);color:var(--t1);line-height:1.6}
.qcard{display:grid;gap:14px}
@media(min-width:760px){.qcard{grid-template-columns:54px 1fr}}
.qcard .qn{font-family:var(--mono);font-size:28px;font-weight:600;color:color-mix(in srgb,var(--accent-fill) 32%,transparent);line-height:1}
.qcard h3{font-size:17px;font-weight:600;line-height:1.35}
.qsplit{display:grid;gap:14px;margin-top:14px}
@media(min-width:680px){.qsplit{grid-template-columns:1fr 1fr}}
.qsplit .lab{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--t2)}
.qsplit .lab.acc{color:var(--accent)}
.qsplit p{margin:6px 0 0;font-size:13.5px;line-height:1.6;color:var(--t1)}
footer{border-top:1px solid var(--line);margin-top:8px}
footer .in{padding-block:26px 34px}
footer p{margin:0}
.foot-s{margin-top:10px!important;font-size:11.5px;line-height:1.65;color:var(--t2);max-width:78ch}
.empty{display:grid;place-items:center;height:200px;border:1px dashed var(--line);border-radius:12px;color:var(--t2);font-size:13px;text-align:center;padding:16px}
</style>

<header class="hero" id="hero">
  <div class="wrap hero-in">
    <p class="eyebrow">AIFC · Day 8 · Clean it · Tell it · Show it</p>
    <h1 id="h1"></h1>
    <p class="tag">From Messy Data to Meaningful Decisions</p>
    <p class="lede" id="lede"></p>
    <div id="herokpis"></div>
  </div>
</header>

<nav class="tabs" aria-label="Sections"><div class="wrap tabs-in" id="tabs"></div></nav>

<div class="filters" id="filters" hidden>
  <div class="wrap filters-in">
    <div class="fgrid">
      <div class="f"><label for="f-area">Area</label><select id="f-area"></select></div>
      <div class="f"><label for="f-status">Status</label><select id="f-status"></select></div>

      <div class="f"><label for="f-from">Date from</label><input id="f-from" type="date"></div>
      <div class="f"><label for="f-to">Date to</label><input id="f-to" type="date"></div>
      <div class="f end"><button class="btn" id="f-reset" type="button">Reset filters</button></div>
    </div>
    <p class="fnote" id="fnote"></p>
  </div>
</div>

<div class="wrap" id="stripwrap" hidden style="padding-top:20px">
  <p class="striplab">Current filter — these four count up whenever you change a control above</p>
  <div class="kpis" id="strip"></div>
</div>

<main class="wrap"><div id="main" class="stack"></div></main>

<footer><div class="wrap in">
  <p style="font-weight:600;font-size:14px">AIFC · Day 8</p>
  <p style="font-size:13.5px;color:var(--t1);margin-top:3px">Clean It · Tell It · Show It</p>

</div></footer>

const ORDERS = DATA.orders, M = DATA.metrics, LOG = DATA.log, EXC = DATA.excluded, AUD = DATA.audit;

function applyFilters(rows, f) {
  return rows.filter(r => {
    if (f.area !== ALL && r.area !== f.area) return false;
    if (f.status !== ALL && r.status !== f.status) return false;
    if (f.item !== ALL && r.item !== f.item) return false;
    if (f.from || f.to) {
      if (!r.dated) return false;
      if (f.from && r.date < f.from) return false;
      if (f.to && r.date > f.to) return false;
    }
    return true;
  });
}
const sum = (rows, pick) => r3(rows.reduce((a, r) => a + pick(r), 0));

function kpis(rows) {
  const d = rows.filter(r => r.status === 'Delivered');
  const revenue = sum(d, r => r.kd);
  const cancelled = rows.filter(r => r.status === 'Cancelled').length;
  return {
    orders: rows.length, delivered: d.length, cancelled,
    pending: rows.filter(r => r.status === 'Pending').length,
    revenue, aov: d.length ? r3(revenue / d.length) : 0,
    cancelRate: rows.length ? Math.round((cancelled / rows.length) * 1000) / 10 : 0,
    areas: new Set(rows.filter(r => r.area !== 'Unknown').map(r => r.area)).size,
    items: new Set(rows.map(r => r.item)).size,
    undated: rows.filter(r => !r.dated).length,
    unknownArea: rows.filter(r => r.area === 'Unknown').length,
    unknownAreaRevenue: sum(d.filter(r => r.area === 'Unknown'), r => r.kd)
  };
}
function groupBy(rows, key) {
  const m = new Map();
  for (const r of rows) {
    const k = r[key];
    const g = m.get(k) || { key:k, orders:0, revenue:0, qty:0 };
    g.orders++; g.revenue += r.kd; g.qty += r.qty; m.set(k, g);
  }
  return [...m.values()].map(g => ({ ...g, revenue:r3(g.revenue), aov:r3(g.revenue / g.orders) }))
                        .sort((a, b) => b.revenue - a.revenue);
}
function byDay(rows) {
  const m = new Map();
  for (const r of rows) {
    if (!r.dated) continue;
    const g = m.get(r.date) || { date:r.date, orders:0, delivered:0, cancelled:0, pending:0, revenue:0 };
    g.orders++;
    if (r.status === 'Delivered') { g.delivered++; g.revenue += r.kd; }
    else if (r.status === 'Cancelled') g.cancelled++; else g.pending++;
    m.set(r.date, g);
  }
  return [...m.values()].map(g => ({ ...g, revenue:r3(g.revenue) })).sort((a, b) => a.date < b.date ? -1 : 1);

function countUp(node) {
  const to = +node.dataset.to, dec = +node.dataset.dec || 0;
  const from = node._v === undefined ? to : node._v;
  const fmt = v => v.toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec});
  if (REDUCED || from === to) { node._v = to; node.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 550;
  cancelAnimationFrame(node._raf);
  const tick = t => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    node.textContent = fmt(from + (to - from) * e);
    if (p < 1) node._raf = requestAnimationFrame(tick); else node._v = to;
  };
  node._raf = requestAnimationFrame(tick);
}
function kpiHTML(label, value, opts) {
  const o = opts || {};
  return '<div class="kpi' + (o.accent ? ' acc' : '') + '">' +
    '<div class="k-l">' + esc(label) + '</div>' +
    '<div class="k-v"><span class="cu" data-to="' + value + '" data-dec="' + (o.dec || 0) + '">' +
      Number(value).toLocaleString('en-US', {minimumFractionDigits:o.dec || 0, maximumFractionDigits:o.dec || 0}) +
    '</span>' + (o.unit ? '<span class="k-u">' + esc(o.unit) + '</span>' : '') + '</div>' +
    (o.sub ? '<div class="k-s">' + o.sub + '</div>' : '') + '</div>';
}
function animateKpis(root, keyed) {
  root.querySelectorAll('.cu').forEach((n, i) => {
    if (keyed && root._cu && root._cu[i] !== undefined) n._v = root._cu[i];
    countUp(n);
  });
  if (keyed) root._cu = [...root.querySelectorAll('.cu')].map(n => +n.dataset.to);
}

/* ------------------------------------------------------------- tooltip */
const TT = $('#tt');
function showTT(x, y, html) { TT.innerHTML = html; TT.style.left = x + 'px'; TT.style.top = y + 'px'; TT.style.opacity = 1; }
function hideTT() { TT.style.opacity = 0; }

/* ------------------------------------------------------- chart: frame */
function frame(o) {
  return '<section class="card cf">' +
    '<h3>' + o.finding + '</h3>' +
    (o.subject ? '<p class="sub">' + o.subject + '</p>' : '') +
    '<div class="plot">' + o.plot + '</div>' +
    '<dl>' +
      '<div><dt>Y axis</dt><dd>' + o.y + '</dd></div>' +
      '<div><dt>X axis</dt><dd>' + o.x + '</dd></div>' +
      '<div><dt>Built from</dt><dd>' + o.basis + '</dd></div>' +
      '<div><dt>Excluded</dt><dd>' + (o.excluded || 'Nothing — every row in the current filter is shown.') + '</dd></div>' +
    '</dl></section>';
}

/* ------------------------------------------- chart: horizontal bars */
function barsH(rows, o) {
  o = o || {};
  const max = Math.max(0, ...rows.map(r => r.value)) || 1;
  const f = o.money ? kdf : (o.pct ? (v => v.toFixed(1) + '%') : intf);
  const bars = rows.map(r => {
    const dim = o.active && o.active !== r.key;
    const col = o.colorFor ? o.colorFor(r.key, r.value) : C.acc;
    return '<div class="bar' + (o.pick ? ' click' : '') + (dim ? ' dim' : '') +
      '" data-k="' + esc(r.key) + '" data-v="' + esc(f(r.value) + (o.money ? ' KD' : (o.pct ? '' : ''))) +
      '" data-n="' + esc(o.measure || 'Value') + '">' +
      '<span class="bl" title="' + esc(r.key) + '">' + esc(r.key) + '</span>' +
      '<span class="bt"><span class="bf" style="--p:' + (r.value / max * 100).toFixed(2) + '%;--c:' + col + '"></span></span>' +
      '<span class="bv">' + f(r.value) + '</span></div>';
  }).join('');
  const ticks = [0, .25, .5, .75, 1].map(p => '<span>' + f(r3(max * p)) + '</span>').join('');
  return '<div class="barchart" data-pick="' + (o.pick || '') + '">' +
    '<div class="bars">' + bars + '</div>' +
    '<div class="axis"><span></span><span class="ticks">' + ticks + '</span><span class="pad"></span></div>' +
    '<p class="axtitle">' + esc(o.axisTitle || '') + '</p></div>';
}

/* --------------------------------------- chart: vertical grouped bars */
function vbars(panel) {
  const max = Math.max(0, ...panel.groups.flatMap(g => g.values)) || 1;
  const f = panel.money ? kdf : intf;
  const ticks = [1, .75, .5, .25, 0].map(p => '<span>' + f(r3(max * p)) + '</span>').join('');
  const groups = panel.groups.map(g =>
    '<div class="vgroup">' + g.values.map((v, i) =>
      '<div class="vbar" data-k="' + esc(g.label) + '" data-n="' + esc(panel.series[i].name) +
      '" data-v="' + esc(f(v) + (panel.money ? ' KD' : '')) +
      '" style="--h:' + (v / max * 100).toFixed(2) + '%;--c:' + panel.series[i].color + '"></div>').join('') +
    '</div>').join('');
  const labs = panel.groups.map(g => '<span>' + esc(g.label) + '</span>').join('');
  const legend = panel.series.map(s =>
    '<span><span class="sw" style="background:' + s.color + '"></span>' + esc(s.name) + '</span>').join('');
  return '<div class="vpanel"><p class="axtitle">' + esc(panel.title) + '</p>' +
    '<div class="vwrap"><div class="vaxis">' + ticks + '</div>' +
    '<div><div class="vplot">' + groups + '</div><div class="vlabs">' + labs + '</div></div></div>' +
    '<div class="legend">' + legend + '</div></div>';
}

/* ------------------------------------------------- chart: line (SVG) */
let LINE_RO = null;
function lineHTML(id) { return '<svg class="lc" id="' + id + '" role="img"></svg>'; }
function drawLine(svg) {
  const cfg = svg._cfg; if (!cfg) return;
  const W = Math.max(300, svg.parentNode.clientWidth), H = 268;
  const f = cfg.money ? kdf : intf;
  const max = Math.max(0, ...cfg.rows.flatMap(r => cfg.series.map(s => r.values[s.name]))) || 1;
  const L = cfg.money ? 62 : 40, R = 12, T = 12, B = 34;
  const iw = W - L - R, ih = H - T - B;
  const X = i => L + (cfg.rows.length === 1 ? iw / 2 : i * iw / (cfg.rows.length - 1));
  const Y = v => T + ih - (v / max) * ih;
  let s = '';
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, y = Y(v);
    s += '<line class="gl" x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) + '"/>';
    s += '<text x="' + (L - 7) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + f(r3(v)) + '</text>';
  }
  s += '<line class="ax" x1="' + L + '" y1="' + (T + ih) + '" x2="' + (W - R) + '" y2="' + (T + ih) + '"/>';
  const every = cfg.rows.length > 9 ? 2 : 1;
  cfg.rows.forEach((r, i) => {
    if (i % every === 0 || i === cfg.rows.length - 1)
      s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 13) + '" text-anchor="middle">' + esc(r.label) + '</text>';
  });
  cfg.series.forEach(se => {
    const pts = cfg.rows.map((r, i) => X(i).toFixed(1) + ',' + Y(r.values[se.name]).toFixed(1)).join(' ');
    s += '<polyline points="' + pts + '" fill="none" stroke="' + se.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    cfg.rows.forEach((r, i) => {
      s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(r.values[se.name]).toFixed(1) + '" r="3" fill="' + se.color + '"/>';
    });
  });
  s += '<line class="cross" id="' + svg.id + '-x" x1="0" y1="' + T + '" x2="0" y2="' + (T + ih) + '"/>';
  cfg.rows.forEach((r, i) => {
    const w = iw / Math.max(1, cfg.rows.length - 1);
    s += '<rect class="hit" data-i="' + i + '" x="' + (X(i) - w / 2).toFixed(1) + '" y="' + T + '" width="' + w.toFixed(1) + '" height="' + ih + '"/>';
  });
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('height', H);
  svg.setAttribute('aria-label', cfg.alt || 'line chart');
  svg.innerHTML = s;
  const cross = svg.querySelector('.cross');
  svg.querySelectorAll('.hit').forEach(h => {
    h.addEventListener('mousemove', ev => {
      const i = +h.dataset.i, row = cfg.rows[i], bb = svg.getBoundingClientRect();
      const sx = bb.width / W;
      cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.style.opacity = .8;
      showTT(bb.left + X(i) * sx, bb.top + Y(Math.max(...cfg.series.map(se => row.values[se.name]))) * sx,
        '<div class="tk">' + esc(row.label) + '</div>' + cfg.series.map(se =>
          '<div class="tr"><span class="sw" style="background:' + se.color + '"></span>' + esc(se.name) +
          '<b>' + f(row.values[se.name]) + (cfg.money ? ' KD' : '') + '</b></div>').join(''));
    });
    h.addEventListener('mouseleave', () => { cross.style.opacity = 0; hideTT(); });
  });
}
function wireLine(id, cfg) {
  const svg = document.getElementById(id); if (!svg) return;
  svg._cfg = cfg; drawLine(svg);
  // identity is never carried by colour alone: every series is named beside its swatch
  const leg = document.createElement('div');
  leg.className = 'legend';
  leg.innerHTML = cfg.series.map(se =>
    '<span><span class="sw" style="background:' + se.color + '"></span>' + esc(se.name) + '</span>').join('');
  svg.after(leg);
  if (!LINE_RO) LINE_RO = new ResizeObserver(es => es.forEach(e => {
    e.target.querySelectorAll('svg.lc').forEach(drawLine);
  }));
  LINE_RO.observe(svg.parentNode);
}

/* ===================================================================== TABS */
function tabOverview(rows) {
  const k = kpis(rows);
  const d = rows.filter(r => r.status === 'Delivered');
  const areas = groupBy(d.filter(r => r.area !== 'Unknown'), 'area');
  const items = groupBy(d, 'item');
  const days = byDay(rows);
  const areaRev = areas.reduce((a, b) => a + b.revenue, 0) || 1;
  const ta = areas[0], ti = items[0];
  let h = '<div class="kpis">' +
    kpiHTML('Top area by revenue', ta ? ta.revenue : 0, {dec:3, unit:'KD',
      sub: ta ? esc(ta.key) + ' — ' + pctf(ta.revenue / areaRev * 100) + ' of area-attributed revenue' : 'No area-attributed orders in view'}) +
    kpiHTML('Top item by revenue', ti ? ti.revenue : 0, {dec:3, unit:'KD',
      sub: ti ? esc(ti.key) + ' — from ' + ti.orders + ' delivered orders' : 'No delivered orders in view'}) +
    kpiHTML('Areas in view', k.areas, {sub:'Named areas. Rows with a blank area count as Unknown.'}) +
    kpiHTML('Cancellation rate', k.cancelRate, {dec:1, unit:'%', sub: k.cancelled + ' cancelled ÷ ' + k.orders + ' orders in view'}) +
  '</div><div class="two">';

  h += areas.length ? frame({
    finding: esc(ta.key) + ' is the largest area at ' + kdf(ta.revenue) + ' KD, ' + pctf(ta.revenue / areaRev * 100) + ' of area-attributed delivered revenue',
    subject: 'Click a bar to filter the whole dashboard to that area.',
    y: 'Area (8 named areas, after standardising 29 raw spellings)',
    x: 'Delivered revenue in Kuwaiti dinar (KD) — axis starts at zero',
    basis: 'Built from ' + d.filter(r => r.area !== 'Unknown').length + ' delivered orders with a named area',
    excluded: k.unknownArea
      ? k.unknownArea + ' order(s) in view have no area in the source file and appear in no bar, so ' + kdf(k.unknownAreaRevenue) + ' KD of delivered revenue sits in the headline but not in this chart. Cancelled and pending orders are also excluded.'
      : 'Cancelled and pending orders are excluded — this is delivered revenue only.',
    plot: barsH(areas.map(a => ({key:a.key, value:a.revenue})), {money:1, pick:'area', measure:'Delivered revenue', axisTitle:'Delivered revenue (KD)'})
  }) : '<section class="card"><div class="empty">No delivered orders with a named area in this selection.</div></section>';

  h += items.length ? frame({
    finding: esc(ti.key) + ' earns the most at ' + kdf(ti.revenue) + ' KD from just ' + ti.orders + ' delivered orders',
    y: 'Menu item (10 items — the one column that arrived already consistent)',
    x: 'Delivered revenue in Kuwaiti dinar (KD) — axis starts at zero',
    basis: 'Built from ' + d.length + ' delivered orders',
    excluded: 'Cancelled and pending orders are excluded — this is delivered revenue only.',
    plot: barsH(items.map(i => ({key:i.key, value:i.revenue})), {money:1, pick:'item', measure:'Delivered revenue', axisTitle:'Delivered revenue (KD)'})
  }) : '<section class="card"><div class="empty">No delivered orders in this selection.</div></section>';
  h += '</div>';

  if (days.length > 1) {
    h += frame({
      finding: 'Orders climb through the second week while delivered revenue stays flat',
      subject: 'The gap between order count and revenue is the whole story — see The Story tab.',
      y: 'Orders per day (count) — one scale, no second axis',
      x: 'Order date, ' + days[0].date + ' to ' + days[days.length - 1].date,
      basis: 'Built from ' + rows.filter(r => r.dated).length + ' orders in view that carry a usable date',
      excluded: k.undated ? k.undated + ' order(s) in view have an unusable date and cannot be placed on a time axis.' : 'Nothing — every order in view has a usable date.',
      plot: lineHTML('lc-ov')
    });
    PENDING.push(() => wireLine('lc-ov', {
      rows: days.map(x => ({label:shortDay(x.date), values:{Delivered:x.delivered, Pending:x.pending, Cancelled:x.cancelled}})),
      series: [{name:'Delivered', color:C.good}, {name:'Pending', color:C.acc}, {name:'Cancelled', color:C.warm}],
      alt: 'Orders per day by status'
    }));
  }

  h += '<section class="card"><h3 style="font-size:14px;font-weight:600">How every number on this page is calculated' +
    '<button class="info" type="button" data-info="calc" aria-expanded="false">i</button></h3>' +
    '<div class="infobox" id="info-calc" hidden>' +
      '<b>Delivered revenue</b> = sum of <code>amount_kd</code> where status = Delivered.<br>' +
      '<b>Average order value</b> = delivered revenue ÷ delivered orders.<br>' +
      '<b>Cancellation rate</b> = cancelled orders ÷ all orders in view.<br>' +
      '<code>amount_kd</code> is the line total, not a unit price. Verified against the derived item price list: all 189 cleaned rows satisfy amount = unit price × quantity.' +
    '</div>' +
    '<p style="margin:9px 0 0;font-size:13.5px;color:var(--t1);max-width:70ch">Revenue means <strong>delivered</strong> revenue throughout this dashboard. Pending and cancelled orders are counted separately and never added to it, because neither has been paid.</p></section>';

  h += tableCard(rows);
  return h;
}

function tabAreas(rows) {
  const named = rows.filter(r => r.area !== 'Unknown');
  const d = named.filter(r => r.status === 'Delivered');
  const rev = groupBy(d, 'area');
  const total = rev.reduce((a, b) => a + b.revenue, 0) || 1;
  const byOrders = [...groupBy(named, 'area')].sort((a, b) => b.orders - a.orders);
  const aov = [...rev].sort((a, b) => b.aov - a.aov);
  const k = kpis(rows);
  const success = byOrders.map(g => {
    const all = named.filter(r => r.area === g.key);
    return { key:g.key, value: Math.round(all.filter(r => r.status === 'Delivered').length / all.length * 1000) / 10 };
  }).sort((a, b) => b.value - a.value);
  let h = '';
  if (state.f.area !== ALL) {

      '<button class="btn sm" type="button" data-clear="area">Clear area</button></div><div class="kpis">' +

      kpiHTML('Cancelled', sel.cancelled, {}) + kpiHTML('Revenue', sel.revenue, {dec:3, unit:'KD', accent:1}) +

  h += '<div class="two">';
  if (rev.length) h += frame({
    finding: esc(rev[0].key) + ' leads on revenue with ' + kdf(rev[0].revenue) + ' KD — ' + pctf(rev[0].revenue / total * 100) + ' of area-attributed delivered revenue',
    subject: 'Click any bar to filter the dashboard to that area.',
    y: 'Area (8 named areas, standardised from 29 raw spellings)',
    x: 'Delivered revenue in Kuwaiti dinar (KD) — axis starts at zero',
    basis: 'Built from ' + d.length + ' delivered orders with a named area',
    excluded: k.unknownArea + ' order(s) in view have a blank area and appear in no bar (' + kdf(k.unknownAreaRevenue) + ' KD of delivered revenue). Cancelled and pending orders excluded.',
    plot: barsH(rev.map(r => ({key:r.key, value:r.revenue})), {money:1, pick:'area', active: state.f.area !== ALL ? state.f.area : null, measure:'Delivered revenue', axisTitle:'Delivered revenue (KD)'})
  });
  if (byOrders.length) h += frame({
    finding: esc(byOrders[0].key) + ' takes the most orders (' + byOrders[0].orders + ') but ' + esc(rev[0].key) + ' takes the most money — volume and value rank differently',
    y: 'Area',
    x: 'Orders (count, all statuses) — axis starts at zero',
    basis: 'Built from ' + named.length + ' orders with a named area, all statuses',
    excluded: k.unknownArea + ' order(s) with a blank area.',
    plot: barsH(byOrders.map(r => ({key:r.key, value:r.orders})), {pick:'area', active: state.f.area !== ALL ? state.f.area : null, measure:'Orders', axisTitle:'Orders (count)'})
  });
  if (aov.length) h += frame({
    finding: esc(aov[0].key) + ' has the highest average order at ' + kdf(aov[0].aov) + ' KD — ' + (aov[0].aov / (aov[aov.length - 1].aov || 1)).toFixed(1) + '× ' + esc(aov[aov.length - 1].key),
    y: 'Area',
    x: 'Average delivered order value in KD — axis starts at zero',
    basis: 'Built from ' + d.length + ' delivered orders with a named area',
    excluded: 'Cancelled and pending orders excluded, and orders with a blank area.',
    plot: barsH(aov.map(r => ({key:r.key, value:r.aov})), {money:1, pick:'area', active: state.f.area !== ALL ? state.f.area : null, measure:'Avg order value', axisTitle:'Average delivered order value (KD)'})
  });
  if (success.length) h += frame({
    finding: 'Delivery success ranges from ' + success[success.length - 1].value.toFixed(1) + '% in ' + esc(success[success.length - 1].key) + ' to ' + success[0].value.toFixed(1) + '% in ' + esc(success[0].key),
    y: 'Area',
    x: "Share of that area's orders that were delivered (%) — axis starts at zero",
    basis: 'Built from ' + named.length + ' orders with a named area, all statuses',
    excluded: k.unknownArea + ' order(s) with a blank area. The remainder of each bar is pending or cancelled.',
    plot: barsH(success, {pct:1, pick:'area', active: state.f.area !== ALL ? state.f.area : null, measure:'Delivered share', axisTitle:'Delivered share of orders (%)', colorFor:(key, v) => v < 80 ? C.warm : C.acc})
  });
  h += '</div>';

  h += '<section class="card"><div class="rowhead"><h3>Area table — delivered orders only</h3></div><div class="tscroll"><table>' +

      {money:1, pick:'item', active:act, measure:'Unit price', axisTitle:'Unit price (KD)'})
  });
  h += '</div>';
  h += '<section class="card" id="itemcard"><div class="rowhead"><h3>Item table — click any column header to sort</h3>' +
    (act ? '<button class="btn sm" type="button" data-clear="item">Clear item filter (' + esc(act) + ')</button>' : '') +
    '</div><div class="tscroll" id="itemtable"></div>' +
    '<p style="margin:11px 0 0;font-size:11.5px;color:var(--t2)">Item revenue reconciles exactly to the headline: every delivered order has an item, so these rows sum to the full delivered revenue with no gap.</p></section>';
  PENDING.push(() => paintItemTable(g, total, d.length));

}
let ITEM_SORT = { c:'revenue', dir:-1 };
function paintItemTable(g, total, dCount) {
  const host = document.getElementById('itemtable'); if (!host) return;
  const cols = [['key','Item',0], ['unit','Unit price (KD)',1], ['orders','Delivered orders',1], ['qty','Units',1], ['revenue','Revenue (KD)',1], ['aov','Avg order (KD)',1]];
  const rows = [...g].sort((a, b) => {
    const A = a[ITEM_SORT.c], B = b[ITEM_SORT.c];
    return (typeof A === 'string' ? A.localeCompare(B) : A - B) * ITEM_SORT.dir;
  });
  host.innerHTML = '<table><thead><tr>' +
    cols.map(([c, l, r]) => '<th class="s' + (r ? ' r' : '') + '" data-sort="' + c + '">' + l +
      (ITEM_SORT.c === c ? '<span style="color:var(--accent)"> ' + (ITEM_SORT.dir === -1 ? '▾' : '▴') + '</span>' : '') + '</th>').join('') +
    '<th class="r">Share</th></tr></thead><tbody>' +
    rows.map(x => '<tr class="click" data-pick="item" data-k="' + esc(x.key) + '"><td>' + esc(x.key) + '</td><td class="r">' + kdf(x.unit) +
      '</td><td class="r">' + intf(x.orders) + '</td><td class="r">' + intf(x.qty) + '</td><td class="r">' + kdf(x.revenue) +
      '</td><td class="r">' + kdf(x.aov) + '</td><td class="r">' + pctf(x.revenue / total * 100) + '</td></tr>').join('') +
    '</tbody><tfoot><tr><td>Total</td><td></td><td class="r">' + intf(dCount) + '</td><td class="r">' +
    intf(g.reduce((a, b) => a + b.qty, 0)) + '</td><td class="r">' + kdf(total) + '</td><td></td><td class="r">100.0%</td></tr></tfoot></table>';
  host.querySelectorAll('th.s').forEach(th => th.addEventListener('click', () => {
    const c = th.dataset.sort;
    ITEM_SORT = { c, dir: ITEM_SORT.c === c && ITEM_SORT.dir === -1 ? 1 : -1 };
    paintItemTable(g, total, dCount);
  }));
}

function tabTime(rows) {
  const days = byDay(rows);
  if (!days.length) return '<section class="card"><div class="empty">No orders with a usable date in this selection.</div></section>';
  const k = kpis(rows);
  const dated = rows.filter(r => r.dated);
  const d = dated.filter(r => r.status === 'Delivered');
  const w1 = d.filter(r => r.date <= '2026-09-07'), w2 = d.filter(r => r.date >= '2026-09-08');
  const r1 = sum(w1, x => x.kd), r2 = sum(w2, x => x.kd);
  const a1 = w1.length ? r3(r1 / w1.length) : 0, a2 = w2.length ? r3(r2 / w2.length) : 0;
  const ordersChg = w1.length ? (w2.length - w1.length) / w1.length * 100 : 0;
  const revChg = r1 ? (r2 - r1) / r1 * 100 : 0;
  const peak = [...days].sort((a, b) => b.revenue - a.revenue)[0];
  const quiet = [...days].sort((a, b) => a.revenue - b.revenue)[0];
  const pre = (from, to, label) => '<button class="btn sm" type="button" data-range="' + from + '|' + to + '"' +
    (state.f.from === from && state.f.to === to ? ' style="border-color:color-mix(in srgb,var(--accent-fill) 50%,var(--line));color:var(--accent)"' : '') + '>' + label + '</button>';
  let h = '<section class="card" style="padding:14px 16px"><div style="display:flex;flex-wrap:wrap;gap:9px;align-items:center">' +
    '<span class="eyebrow" style="margin-right:4px">Quick range</span>' +
    pre('', '', 'All 14 days') + pre('2026-09-01', '2026-09-07', 'Week 1 · Sep 1–7') + pre('2026-09-08', '2026-09-14', 'Week 2 · Sep 8–14') +
    '<span style="margin-left:auto;font-size:11.5px;color:var(--t2)">Data covers ' + DATE_MIN + ' to ' + DATE_MAX + ' — 14 trading days</span></div></section>';
  h += '<div class="kpis">' +
    kpiHTML('Days in view', days.length, {sub:'Days with at least one dated order'}) +
    kpiHTML('Delivered revenue', sum(d, x => x.kd), {dec:3, unit:'KD', accent:1, sub:'From ' + d.length + ' dated delivered orders'}) +
    kpiHTML('Busiest day by revenue', peak.revenue, {dec:3, unit:'KD', sub: peak.date + ' — ' + peak.delivered + ' delivered'}) +
    kpiHTML('Quietest day by revenue', quiet.revenue, {dec:3, unit:'KD', sub: quiet.date + ' — ' + quiet.delivered + ' delivered'}) + '</div>';
  h += frame({
    finding: 'Delivered revenue swings between ' + kdf(quiet.revenue) + ' and ' + kdf(peak.revenue) + ' KD a day with no upward trend',
    y: 'Delivered revenue per day in Kuwaiti dinar (KD) — axis starts at zero',
    x: 'Order date, ' + days[0].date + ' to ' + days[days.length - 1].date,
    basis: 'Built from ' + d.length + ' dated delivered orders across ' + days.length + ' days',
    excluded: 'Cancelled and pending orders excluded.' + (k.undated ? ' ' + k.undated + ' order(s) in view carry an unusable date and appear on no day.' : ''),
    plot: lineHTML('lc-rev')
  });
  PENDING.push(() => wireLine('lc-rev', {
    rows: days.map(x => ({label:shortDay(x.date), values:{'Delivered revenue (KD)':x.revenue}})),
    series: [{name:'Delivered revenue (KD)', color:C.acc}], money:1, alt:'Delivered revenue per day'
  }));
  h += frame({
    finding: 'Order volume rises across the fortnight — delivered, pending and cancelled counts per day',
    y: 'Orders per day (count) — axis starts at zero',
    x: 'Order date, ' + days[0].date + ' to ' + days[days.length - 1].date,
    basis: 'Built from ' + dated.length + ' dated orders in view, all statuses',
    excluded: k.undated ? k.undated + ' order(s) with an unusable date.' : 'Nothing — every order in view has a usable date.',
    plot: lineHTML('lc-cnt')
  });
  PENDING.push(() => wireLine('lc-cnt', {
    rows: days.map(x => ({label:shortDay(x.date), values:{Delivered:x.delivered, Pending:x.pending, Cancelled:x.cancelled}})),
    series: [{name:'Delivered', color:C.good}, {name:'Pending', color:C.acc}, {name:'Cancelled', color:C.warm}],
    alt:'Orders per day by status'
  }));
  if (w1.length && w2.length) h += frame({
    finding: 'Orders rose ' + ordersChg.toFixed(1) + '% between the two weeks while revenue moved ' + revChg.toFixed(1) + '%',
    subject: 'Two measures, two panels, two scales — never two axes on one plot.',
    y: 'Left panel: delivered orders (count), zero-based. Right panel: average delivered order value in KD, zero-based.',
    x: 'Week (Sep 1–7 against Sep 8–14)',
    basis: 'Built from ' + (w1.length + w2.length) + ' dated delivered orders',
    excluded: 'Cancelled and pending orders excluded. Orders without a usable date excluded.',
    plot: '<div style="display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))">' +
      vbars({title:'Delivered orders (count)', groups:[{label:'Sep 1–7', values:[w1.length]}, {label:'Sep 8–14', values:[w2.length]}], series:[{name:'Delivered orders', color:C.acc}]}) +
      vbars({title:'Average order value (KD)', money:1, groups:[{label:'Sep 1–7', values:[a1]}, {label:'Sep 8–14', values:[a2]}], series:[{name:'Avg order value', color:C.warm}]}) +
      '</div>'
  });
  h += '<section class="card"><div class="rowhead"><h3>Day table</h3></div><div class="tscroll"><table>' +
    '<thead><tr><th>Date</th><th class="r">Orders</th><th class="r">Delivered</th><th class="r">Pending</th><th class="r">Cancelled</th><th class="r">Delivered revenue (KD)</th></tr></thead><tbody>' +
    days.map(x => '<tr><td>' + x.date + '</td><td class="r">' + x.orders + '</td><td class="r">' + x.delivered +
      '</td><td class="r">' + x.pending + '</td><td class="r">' + x.cancelled + '</td><td class="r">' + kdf(x.revenue) + '</td></tr>').join('') +
    '</tbody></table></div></section>';
  return h;
}

  return '<div><h2 style="font-size:clamp(21px,4vw,32px);font-weight:700">What I would ask next</h2>' +
    '<p style="margin:9px 0 0;max-width:70ch;font-size:13.5px;line-height:1.65;color:var(--t1)">Three questions this dataset raises and cannot answer. Each one would change a decision, and each one needs data that simply is not in the file. Listing them is not a failure of the analysis — knowing the edge of what you can prove is part of the analysis.</p></div>' +
    QUESTIONS.map((x, i) => '<section class="card"><div class="qcard"><div class="qn">' + String(i + 1).padStart(2, '0') + '</div><div>' +
      '<h3>' + esc(x.q) + '</h3><div class="qsplit"><div><div class="lab">Why it matters</div><p>' + esc(x.why) + '</p></div>' +
      '<div><div class="lab acc">What we would need to collect</div><p>' + esc(x.need) + '</p></div></div></div></div></section>').join('');
}

/* ------------------------------------------------------------ data table */
const TCOLS = [['id','Order ID',0],['area','Area',0],['date','Date',0],['item','Item',0],['qty','Qty',1],['kd','Amount (KD)',1],['pay','Payment',0],['status','Status',0]];
const PAGE = 15;
let TSTATE = { q:'', c:'date', dir:1, page:0 };
function tableCard() {
  return '<section class="card" id="tcard"><div class="rowhead"><h3>Cleaned orders — search, sort and page through every row</h3>' +
    '<input class="search" id="tq" type="search" placeholder="Search any field…" aria-label="Search orders" value="' + esc(TSTATE.q) + '"></div>' +
    '<div class="tscroll" id="tbody"></div><div class="pager" id="tpager"></div></section>';
}
function paintTable(rows) {
  const host = document.getElementById('tbody'), pag = document.getElementById('tpager');
  if (!host) return;
  const needle = TSTATE.q.trim().toLowerCase();
  const f = needle ? rows.filter(r => [r.id, r.area, r.date, r.item, r.pay, r.status].join(' ').toLowerCase().includes(needle)) : rows;
  const view = [...f].sort((a, b) => {
    const A = a[TSTATE.c], B = b[TSTATE.c];
    return (typeof A === 'number' && typeof B === 'number' ? A - B : String(A).localeCompare(String(B))) * TSTATE.dir;
  });
  const pages = Math.max(1, Math.ceil(view.length / PAGE));
  const p = Math.min(TSTATE.page, pages - 1);
  const slice = view.slice(p * PAGE, p * PAGE + PAGE);
  host.innerHTML = '<table style="min-width:700px"><thead><tr>' +
    TCOLS.map(([c, l, r]) => '<th class="s' + (r ? ' r' : '') + '" data-tsort="' + c + '">' + l +
      (TSTATE.c === c ? '<span style="color:var(--accent)"> ' + (TSTATE.dir === 1 ? '▴' : '▾') + '</span>' : '') + '</th>').join('') +
    '</tr></thead><tbody>' +
    (slice.length ? slice.map(r => '<tr><td style="font-weight:500">' + esc(r.id) + '</td>' +
      '<td>' + (r.area === 'Unknown' ? '<span style="color:var(--warm)">Unknown</span>' : esc(r.area)) + '</td>' +
      '<td>' + (r.dated ? r.date : '<span style="color:var(--warm)" title="Date was 31/09/2026 or 2027-09-03 — not usable">no usable date</span>') + '</td>' +
      '<td>' + esc(r.item) + '</td><td class="r">' + intf(r.qty) + '</td><td class="r">' + kdf(r.kd) + '</td>' +
      '<td style="color:var(--t1)">' + esc(r.pay) + '</td><td>' + esc(r.status) + '</td></tr>').join('')
      : '<tr><td colspan="8" style="text-align:center;padding:26px;color:var(--t2)">No rows match.</td></tr>') +
    '</tbody></table>';
  pag.innerHTML = '<span>Showing <strong class="mono" style="color:var(--t0)">' + slice.length + '</strong> of <strong class="mono" style="color:var(--t0)">' +
    view.length + '</strong> rows in the current filter</span><span style="display:flex;gap:8px;align-items:center">' +
    '<button class="btn sm" type="button" data-page="' + (p - 1) + '"' + (p === 0 ? ' disabled' : '') + '>Previous</button>' +
    '<span class="mono">Page ' + (p + 1) + ' / ' + pages + '</span>' +
    '<button class="btn sm" type="button" data-page="' + (p + 1) + '"' + (p >= pages - 1 ? ' disabled' : '') + '>Next</button></span>';
  host.querySelectorAll('th.s').forEach(th => th.addEventListener('click', () => {
    const c = th.dataset.tsort;
    TSTATE = { ...TSTATE, c, dir: TSTATE.c === c && TSTATE.dir === 1 ? -1 : 1, page:0 };
    paintTable(rows);
  }));
  pag.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => {
    TSTATE.page = Math.max(0, Math.min(pages - 1, +b.dataset.page)); paintTable(rows);
  }));
  const q = document.getElementById('tq');
  if (q && !q._wired) { q._wired = 1; q.addEventListener('input', () => { TSTATE.q = q.value; TSTATE.page = 0; paintTable(rows); }); }
}

/* ------------------------------------------------------------- rendering */
let PENDING = [];
function setF(patch) { state.f = { ...state.f, ...patch }; render(); }

function render() {
  PENDING = [];
  const heroFull = state.tab === 'Overview';
  const hero = $('#hero');
  hero.classList.toggle('slim', !heroFull);
  $('#h1').innerHTML = heroFull ? 'KUWAIT ORDERS<br><span class="b">DATA LAB</span>' : 'KUWAIT ORDERS <span class="b">DATA LAB</span>';
  $('#lede').hidden = !heroFull;
  $('#lede').textContent = M.raw_rows + ' raw rows audited before a single value was changed, cleaned to ' + M.clean_rows +
    ', with all ' + M.excluded_rows + ' exclusions named. Every figure here traces to a row in the source file.';
  const hk = $('#herokpis');
  if (heroFull) {
    hk.hidden = false;
    if (!hk._done) {
      hk.innerHTML = '<p class="striplab mute" style="margin-top:24px">The whole cleaned dataset — these six do not move when you filter</p><div class="kpis">' +
        kpiHTML('Total orders', M.clean_rows, {sub: M.raw_rows + ' raw − ' + M.excluded_rows + ' excluded'}) +
        kpiHTML('Delivered orders', M.delivered_orders, {sub: M.pending_orders + ' pending · ' + M.cancelled_orders + ' cancelled'}) +
        kpiHTML('Delivered revenue', M.delivered_revenue_kd, {dec:3, unit:'KD', accent:1, sub:'Across ' + M.trading_days + ' trading days'}) +
        kpiHTML('Average order value', M.avg_order_value_kd, {dec:3, unit:'KD', sub: kdf(M.delivered_revenue_kd) + ' ÷ ' + M.delivered_orders + ' orders'}) +
        kpiHTML('Areas covered', M.areas_covered, {sub:'Standardised from 29 raw spellings'}) +
        kpiHTML('Data quality issues', LOG.length, {sub:'Documented decisions, every one with a reason'}) + '</div>';
      hk._done = 1;
      animateKpis(hk, false);
    }
  } else hk.hidden = true;

  document.querySelectorAll('.tab').forEach(b => {
    if (b.dataset.t === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });

  const showF = FILTERED_TABS.includes(state.tab);
  $('#filters').hidden = !showF;
  $('#stripwrap').hidden = !showF;

  const rows = applyFilters(ORDERS, state.f);
  $('#f-reset').disabled = !dirty();
  $('#fnote').innerHTML = dirty()
    ? 'Filters active — showing <strong style="color:var(--accent)" class="mono">' + rows.length + '</strong> of ' + M.clean_rows + ' cleaned orders. Every KPI and chart below reflects this selection.'
    : 'Showing all <strong class="mono" style="color:var(--t0)">' + M.clean_rows + '</strong> cleaned orders.';

  if (showF) {
    const k = kpis(rows), strip = $('#strip');
    strip.innerHTML =
      kpiHTML('Orders in view', k.orders, {sub:'Updates live with the filters above'}) +
      kpiHTML('Delivered in view', k.delivered, {sub: k.cancelled + ' cancelled · ' + k.pending + ' pending'}) +
      kpiHTML('Revenue in view', k.revenue, {dec:3, unit:'KD', accent:1, sub:'Delivered orders only'}) +
      kpiHTML('Avg order in view', k.aov, {dec:3, unit:'KD', sub:'Delivered revenue ÷ delivered orders'});
    animateKpis(strip, true);
  }

  const main = $('#main');
  if (showF && rows.length === 0) {
    main.innerHTML = '<section class="card" style="text-align:center;padding:40px 18px"><p style="font-weight:600;font-size:17px;margin:0">No orders match these filters.</p>' +
      '<button class="btn sm" type="button" id="empty-reset" style="margin-top:14px">Reset filters</button></section>';
    $('#empty-reset').addEventListener('click', () => setF(emptyF()));
    return;
  }
  main.innerHTML =
    state.tab === 'Overview' ? tabOverview(rows) :
    state.tab === 'Areas' ? tabAreas(rows) :
    state.tab === 'Items' ? tabItems(rows) :
    state.tab === 'Time' ? tabTime(rows) :
    state.tab === 'Quality' ? tabQuality() :
    state.tab === 'The Story' ? tabStory() : tabAsk();
  PENDING.forEach(fn => fn());
  if (state.tab === 'Overview') paintTable(rows);
  animateKpis(main, false);
  $('#footnote').innerHTML = 'Data analyzed from the provided Kuwait Orders practice dataset (kuwait-orders-dirty.csv, ' + M.raw_rows +
    ' rows). The dataset is invented for the exercise — every name, email and phone number in it is fictional. The original file was preserved unchanged and is linked from the Quality tab alongside the cleaned version. ' +
    M.excluded_rows + ' rows were excluded: 5 duplicates and 1 row whose amount and quantity contradicted each other.';
}

/* ------------------------------------------------------------- wiring */
$('#tabs').innerHTML = TABS.map(t => '<button class="tab" type="button" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('');
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  state.tab = b.dataset.t; window.scrollTo({top:0, behavior: REDUCED ? 'auto' : 'smooth'}); render();
});
function fillSelect(id, opts, allLabel) {
  $(id).innerHTML = '<option value="' + ALL + '">' + allLabel + '</option>' + opts.map(o => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join('');
}
fillSelect('#f-area', AREAS, 'All areas');
fillSelect('#f-status', STATUSES, 'All statuses');
fillSelect('#f-item', ITEMS, 'All items');
$('#f-from').min = DATE_MIN; $('#f-from').max = DATE_MAX;
$('#f-to').min = DATE_MIN; $('#f-to').max = DATE_MAX;
const syncControls = () => {
  $('#f-area').value = state.f.area; $('#f-status').value = state.f.status; $('#f-item').value = state.f.item;
  $('#f-from').value = state.f.from; $('#f-to').value = state.f.to;
};
$('#f-area').addEventListener('change', e => setF({area:e.target.value}));
$('#f-status').addEventListener('change', e => setF({status:e.target.value}));
$('#f-item').addEventListener('change', e => setF({item:e.target.value}));
$('#f-from').addEventListener('change', e => setF({from:e.target.value}));
$('#f-to').addEventListener('change', e => setF({to:e.target.value}));
$('#f-reset').addEventListener('click', () => { state.f = emptyF(); syncControls(); render(); });

const main = $('#main');
main.addEventListener('click', e => {
  const bar = e.target.closest('.bar');
  if (bar) {
    const kind = bar.closest('.barchart') && bar.closest('.barchart').dataset.pick;
    if (kind) { state.f[kind] = state.f[kind] === bar.dataset.k ? ALL : bar.dataset.k; syncControls(); render(); return; }
  }
  const tr = e.target.closest('tr.click');
  if (tr) { state.f[tr.dataset.pick] = tr.dataset.k; syncControls(); render(); return; }
  const clr = e.target.closest('[data-clear]');
  if (clr) { state.f[clr.dataset.clear] = ALL; syncControls(); render(); return; }
  const rng = e.target.closest('[data-range]');
  if (rng) { const [a, b] = rng.dataset.range.split('|'); state.f.from = a; state.f.to = b; syncControls(); render(); return; }
  const inf = e.target.closest('[data-info]');
  if (inf) {
    const box = document.getElementById('info-' + inf.dataset.info);
    box.hidden = !box.hidden; inf.setAttribute('aria-expanded', String(!box.hidden));
  }
});
main.addEventListener('mousemove', e => {
  const t = e.target.closest('.bar, .vbar');
  if (!t) { hideTT(); return; }
  const b = t.getBoundingClientRect();
  showTT(t.classList.contains('vbar') ? b.left + b.width / 2 : e.clientX, t.classList.contains('vbar') ? b.top : b.top,
    '<div class="tk">' + esc(t.dataset.k) + '</div><div class="tr">' + esc(t.dataset.n) + '<b>' + esc(t.dataset.v) + '</b></div>');
});
main.addEventListener('mouseleave', hideTT);
window.addEventListener('scroll', hideTT, {passive:true});

syncControls();
render();
</script>
